<section class="intro">
  <p class="page-header">Books</p>
  <span>Showcase of books i've read, with rating and review. Coming from my BookHive shelf.</span>
</section>

<section class="book-grid">
  @for (book of books; track book.title) {
  <div class="book-item" (click)="openBook(book.link)">
    @if(book.cover) {
    <div class="cover-wrapper">
      <img #cover [src]="book.cover" (error)="cover.hidden = true" alt="" />
      <div class="cover-placeholder"><svg lucideImageOff class="lucide-icon"></svg></div>
    </div>
    }
    <div class="book-details">
      <span class="title">{{ book.title }}</span>
      @if(book.review) {
      <p class="review">{{ book.review }}</p>
      } @if(book.rating) {
      <app-rating [rating]="book.rating"></app-rating>
      }
    </div>
  </div>
  } @empty {
  <app-loader></app-loader>
  }
</section>
