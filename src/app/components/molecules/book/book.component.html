<div class="book" [class.loaded]="img.loaded">
  <!-- page sheets, outermost first so inner sheets overlap them -->
  <span class="page" style="--i: 4"></span>
  <span class="page" style="--i: 3"></span>
  <span class="page" style="--i: 2"></span>
  <span class="page" style="--i: 1"></span>
  <img appCover #img="cover" [src]="cover" alt="" />
  <div class="cover-placeholder"><svg lucideImageOff class="lucide-icon"></svg></div>
</div>
