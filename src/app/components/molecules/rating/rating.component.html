<span class="star-rating">
  <span class="stars">
    @for(star of totalStars; track $index) {
    <svg lucideStar class="empty-star" size="16" color="var(--text2)"></svg>
    }
  </span>

  <span class="stars rating">
    @for (star of fullStars(); track $index) {
    <svg lucideStar class="star" size="16" color="var(--text2)"></svg>
    } @if (hasHalfStar()) {
    <svg lucideStarHalf class="star" size="16" color="var(--text2)"></svg>
    }
  </span>
</span>
